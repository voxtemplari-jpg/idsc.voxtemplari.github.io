<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Newsroom | Vox Templari</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="admin-body">

<section id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="brand-mark">VT</div>

    <h1>Newsroom</h1>

    <p class="status">
      Authorized Vox Templari staff only.
    </p>

    <div id="loginNotice" class="notice hidden"></div>

    <form id="loginForm">

      <div class="field">
        <label>Email</label>
        <input
          id="email"
          type="email"
          required
          autocomplete="username"
        >
      </div>

      <div class="field">
        <label>Password</label>
        <input
          id="password"
          type="password"
          required
          autocomplete="current-password"
        >
      </div>

      <button class="btn btn-primary" type="submit">
        Sign in
      </button>

    </form>
  </div>
</section>


<section id="dashboard" class="hidden">

  <header class="admin-top">
    <div class="container">

      <strong>
        Vox Templari Newsroom
      </strong>

      <div class="actions">

        <span
          id="userLabel"
          class="status"
          style="color:#dbe8e0"
        ></span>

        <button
          id="logoutBtn"
          class="btn btn-secondary"
        >
          Log out
        </button>

      </div>
    </div>
  </header>


  <div class="admin-layout">

    <aside class="sidebar">

      <button id="newArticleBtn">
        ＋ New article
      </button>

      <a href="index.html" target="_blank">
        ↗ View website
      </a>

      <a href="#articles">
        All articles
      </a>

      <a href="#featuredPanel">
        Featured order
      </a>

    </aside>


    <main class="admin-main">

      <section class="panel">

        <h2 id="formTitle">
          New Article
        </h2>

        <form id="articleForm">

          <div class="form-grid">


            <div class="field full">

              <label>
                Headline
              </label>

              <input
                id="titleInput"
                required
                placeholder="Write a clear, specific headline"
              >

            </div>


            <div class="field">

              <label>
                URL slug
              </label>

              <input
                id="slugInput"
                placeholder="generated-from-headline"
              >

            </div>


            <div class="field">

              <label>
                Section
              </label>

              <select id="categoryInput">

                <option>
                  News
                </option>

                <option>
                  Features
                </option>

                <option>
                  Editorial
                </option>

                <option>
                  Opinion
                </option>

                <option>
                  Sports
                </option>

                <option>
                  Campus Life
                </option>

                <option>
                  Photojournalism
                </option>

              </select>

            </div>


            <div class="field">

              <label>
                Byline
              </label>

              <input
                id="authorInput"
                placeholder="Writer's name"
              >

            </div>


            <div class="field">

              <label>
                Current status
              </label>

              <select id="statusInput">

                <option value="draft">
                  Draft
                </option>

                <option value="published">
                  Published
                </option>

              </select>

            </div>


            <div class="field full">

              <label>
                Deck / excerpt
              </label>

              <textarea
                id="excerptInput"
                maxlength="420"
                placeholder="1–2 sentence summary shown on the homepage"
              ></textarea>

            </div>


            <div class="field">

              <label>
                Featured image
              </label>

              <input
                id="imageFile"
                type="file"
                accept="image/*"
              >

              <input
                id="imageUrlInput"
                type="url"
                placeholder="or paste an image URL"
              >

            </div>


            <div class="field">

              <label>
                Image alt text
              </label>

              <input
                id="imageAltInput"
                placeholder="Describe the image for accessibility"
              >

            </div>


            <div class="field full">

              <label>
                Article body
              </label>


              <div
                id="toolbar"
                class="editor-toolbar"
                role="toolbar"
                aria-label="Article formatting toolbar"
              >

                <!-- FONT -->
                <select
                  id="fontFamilySelect"
                  class="editor-select editor-font"
                  aria-label="Font family"
                  title="Font family"
                >

                  <option value="">
                    Font
                  </option>

                  <option value="Georgia">
                    Georgia
                  </option>

                  <option value="Arial">
                    Arial
                  </option>

                  <option value="Helvetica">
                    Helvetica
                  </option>

                  <option value="Times New Roman">
                    Times New Roman
                  </option>

                  <option value="Verdana">
                    Verdana
                  </option>

                  <option value="Trebuchet MS">
                    Trebuchet MS
                  </option>

                </select>


                <!-- FONT SIZE -->
                <select
                  id="fontSizeSelect"
                  class="editor-select editor-size"
                  aria-label="Text size"
                  title="Text size"
                >

                  <option value="">
                    Size
                  </option>

                  <option value="2">
                    Small
                  </option>

                  <option value="3">
                    Normal
                  </option>

                  <option value="4">
                    Medium
                  </option>

                  <option value="5">
                    Large
                  </option>

                  <option value="6">
                    Extra Large
                  </option>

                </select>


                <span
                  class="toolbar-separator"
                  aria-hidden="true"
                ></span>


                <!-- TEXT STYLE -->

                <button
                  type="button"
                  data-cmd="bold"
                  title="Bold"
                >
                  <b>B</b>
                </button>


                <button
                  type="button"
                  data-cmd="italic"
                  title="Italic"
                >
                  <i>I</i>
                </button>


                <button
                  type="button"
                  data-cmd="underline"
                  title="Underline"
                >
                  <u>U</u>
                </button>


                <span
                  class="toolbar-separator"
                  aria-hidden="true"
                ></span>


                <!-- ALIGNMENT -->

                <button
                  type="button"
                  data-cmd="justifyLeft"
                  title="Align left"
                >
                  ≡
                </button>


                <button
                  type="button"
                  data-cmd="justifyCenter"
                  title="Align center"
                >
                  ≡
                </button>


                <button
                  type="button"
                  data-cmd="justifyRight"
                  title="Align right"
                >
                  ≡
                </button>


                <button
                  type="button"
                  data-cmd="justifyFull"
                  title="Justify"
                >
                  ☰
                </button>


                <span
                  class="toolbar-separator"
                  aria-hidden="true"
                ></span>


                <!-- HEADINGS -->

                <button
                  type="button"
                  data-cmd="formatBlock"
                  data-value="p"
                  title="Normal paragraph"
                >
                  P
                </button>


                <button
                  type="button"
                  data-cmd="formatBlock"
                  data-value="h2"
                  title="Heading 2"
                >
                  H2
                </button>


                <button
                  type="button"
                  data-cmd="formatBlock"
                  data-value="h3"
                  title="Heading 3"
                >
                  H3
                </button>


                <span
                  class="toolbar-separator"
                  aria-hidden="true"
                ></span>


                <!-- LISTS -->

                <button
                  type="button"
                  data-cmd="insertUnorderedList"
                  title="Bulleted list"
                >
                  • List
                </button>


                <button
                  type="button"
                  data-cmd="insertOrderedList"
                  title="Numbered list"
                >
                  1. List
                </button>


                <!-- QUOTE -->

                <button
                  type="button"
                  data-cmd="formatBlock"
                  data-value="blockquote"
                  title="Quote"
                >
                  Quote
                </button>


                <!-- LINK -->

                <button
                  type="button"
                  data-cmd="createLink"
                  title="Insert link"
                >
                  Link
                </button>


                <span
                  class="toolbar-separator"
                  aria-hidden="true"
                ></span>


                <!-- UNDO / REDO -->

                <button
                  type="button"
                  data-cmd="undo"
                  title="Undo"
                >
                  ↶
                </button>


                <button
                  type="button"
                  data-cmd="redo"
                  title="Redo"
                >
                  ↷
                </button>


                <!-- CLEAR -->

                <button
                  type="button"
                  data-cmd="removeFormat"
                  title="Clear formatting"
                >
                  Clear
                </button>

              </div>


              <div
                id="editor"
                class="rich-editor"
                contenteditable="true"
                spellcheck="true"
              ></div>

            </div>

          </div>


          <div
            class="actions"
            style="margin-top:16px"
          >

            <button
              id="saveDraftBtn"
              type="button"
              class="btn btn-secondary"
            >
              Save draft
            </button>


            <button
              id="publishBtn"
              type="button"
              class="btn btn-gold"
            >
              Publish
            </button>


            <button
              type="submit"
              class="btn btn-primary"
            >
              Save changes
            </button>


            <span
              id="saveStatus"
              class="status"
            ></span>

          </div>

        </form>

      </section>


      <section
        id="articles"
        class="panel"
      >

        <h2>
          Articles
        </h2>

        <div
          id="articleList"
          class="article-list"
        ></div>

      </section>


      <section
        id="featuredPanel"
        class="panel"
      >

        <h2>
          Featured story order
        </h2>

        <p class="status">
          Drag stories into the order you want.
          The first item becomes the lead story.
        </p>

        <div
          id="featuredList"
          class="drag-list"
        ></div>

        <button
          id="saveFeaturedBtn"
          class="btn btn-primary"
          style="margin-top:12px"
        >
          Save featured order
        </button>

      </section>

    </main>

  </div>

</section>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/admin.js"></script>

</body>
</html>
